[package]
name = "license-signer"
version = "0.1.0"
edition = "2021"
description = "Storyboard Copilot 离线授权签发工具（仅供发布者使用，私钥严禁外发）"

[[bin]]
name = "license-signer"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
strip = true
